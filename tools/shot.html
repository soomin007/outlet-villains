<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>판 찍기</title>
<!--
  받은 그림 검사용(docs/art-rules.md). 게임을 틀에 열어 원하는 판으로 바로 가고, 원하면 장면 일부를 확대한다. 게임 코드는 건드리지 않는다.
  주소 예: shot.html?level=3 (1-4), shot.html?level=3&zoom=2.5&x=180&y=110 (장면 좌표 x, y를 왼쪽 위로 2.5배),
  shot.html?title=1&w=375&h=812 (메인 화면을 375 x 812 틀로), title=1&cleared=13 (모든 판을 깬 메인 화면).
  solve=1을 붙이면 해법 탐색기의 최단 풀이대로 판을 깨고, 깬 뒤 장면(로봇이 충전 독에 올라앉은 모습)을 찍는다. 이때는 --virtual-time-budget을 40000 이상 준다.
  steps=N을 붙이면 최단 풀이의 앞 N걸음만 누른 장면을 찍는다(걸어 다니는 손님과 로봇이 함께 움직이는 중간 모습 확인용, 2026-11-02).
  swap=이름:경로(여럿이면 쉼표)를 붙이면 장면 속 그 그림(파일 이름이 이름.png나 이름.webp)을 경로의 시험 그림으로 바꿔 찍는다. 그림 목록은 건드리지 않는다.
  예: swap=villain-sleep:../assets/style-test/villain-sleep-v2.png
  headless Chrome으로 찍을 때는 --virtual-time-budget을 15000 이상 준다(판 시작 연출이 끝나야 한다). 창 크기는 w, h와 같게 준다.
-->
<style>
  html, body { margin: 0; background: #111; overflow: hidden; }
  iframe { border: 0; display: block; }
</style>
</head>
<body>
<iframe id="game" title="game"></iframe>
<script src="../src/layout.js"></script>
<script src="../src/engine.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const title = params.get('title') === '1';
  const level = Number(params.get('level') || 0);
  const cleared = Number(params.get('cleared') || level);
  const zoom = Number(params.get('zoom') || 0);
  const steps = params.has('steps') ? Number(params.get('steps')) : null;
  const solve = params.get('solve') === '1' || steps !== null;
  const STORAGE_KEY = 'villain-settings-2';

  // 진행 저장값을 그 판 앞까지 깬 것으로 맞춰, 메인 화면의 이어하기가 그 판을 연다.
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  saved.cleared = window.VILLAIN_LAYOUT.levels.slice(0, cleared).map((item) => item.id);
  saved.lastLevel = Math.min(level, window.VILLAIN_LAYOUT.levels.length - 1);
  saved.prologueSeen = true;
  // pad=1이면 휴대폰 방향 버튼을 켠 화면을 찍는다.
  if (params.get('pad') === '1') saved.padMode = 'on';
  localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));

  const frame = document.getElementById('game');
  frame.style.width = `${params.get('w') || 1920}px`;
  frame.style.height = `${params.get('h') || 1080}px`;
  const press = (key) => frame.contentDocument.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
  frame.addEventListener('load', () => {
    setTimeout(() => press('Enter'), 800);
    if (title) return;
    setTimeout(() => press('Enter'), 1600);
    // 챕터 첫 판의 빌런 소개 카드를 닫는다. 카드가 없으면 판 시작 연출을 건너뛸 뿐이다. card=1이면 카드를 닫지 않고 찍는다(소개 글 줄 끝 확인용).
    if (params.get('card') === '1') return;
    setTimeout(() => press('Enter'), 4500);
    // 받은 시험 그림을 게임에 얹어 보기(docs/art-rules.md "받은 그림 검사" 2번). 장면이 다시 그려져도 바뀌도록 1초마다 다시 건다.
    const swaps = (params.get('swap') || '').split(',').filter(Boolean).map((pair) => pair.split(':'));
    if (swaps.length) {
      setInterval(() => {
        frame.contentDocument.querySelectorAll('#scene img').forEach((image) => {
          const src = image.getAttribute('src') || '';
          for (const [name, path] of swaps) {
            if (new RegExp(`/${name}\.(png|webp)$`).test(src)) image.setAttribute('src', path);
          }
        });
      }, 1000);
    }
    const zoomIn = () => {
      const doc = frame.contentDocument;
      const scene = doc.querySelector('#scene');
      scene.style.transformOrigin = '0 0';
      scene.style.transform = `translate(${-zoom * Number(params.get('x') || 0)}px, ${-zoom * Number(params.get('y') || 0)}px) scale(${zoom})`;
      doc.querySelectorAll('.hud, .keys, .help, #next-cue').forEach((element) => { element.style.visibility = 'hidden'; });
    };
    if (solve) {
      setTimeout(playSolution, 9000);
      return;
    }
    if (zoom) setTimeout(zoomIn, 9000);

    // 최단 풀이를 누른다. 연출 중에 누른 키는 건너뛰기로 쓰이므로, 로봇이 움직였는지 보고 안 움직였으면 다시 누른다(tools/playthrough.html과 같다).
    async function playSolution() {
      const definition = window.VILLAIN_LAYOUT.levels[level];
      const path = (VillainEngine.solve(VillainEngine.parseLevel(definition)).path || []).slice(0, steps === null ? undefined : steps);
      const keys = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' };
      const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const robotSpot = () => {
        const image = [...frame.contentDocument.querySelectorAll('#scene img')].find((element) => /player-/.test(element.getAttribute('src') || ''));
        return image ? image.closest('.sprite').style.transform : '';
      };
      for (const direction of path) {
        for (let attempt = 0; attempt < 8; attempt += 1) {
          const before = robotSpot();
          press(keys[direction]);
          await pause(350);
          if (robotSpot() !== before) break;
          await pause(600);
        }
      }
      await pause(steps === null ? 9000 : 1500);
      // headless Chrome의 가상 시간에서는 CSS 전환(빌런이 사라지기, 배터리 차기)이 끝나지 않아, 찍기 전에 전환을 꺼서 끝 모습으로 보낸다.
      const still = frame.contentDocument.createElement('style');
      still.textContent = '*, *::before, *::after { transition: none !important; }';
      frame.contentDocument.head.appendChild(still);
      if (zoom) zoomIn();
    }
  });
  frame.src = `../index.html?shot=${Date.now()}`;
</script>
</body>
</html>
