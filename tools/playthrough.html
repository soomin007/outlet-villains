<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>자동 플레이 검사</title>
<!--
  모든 판을 실제 게임 화면에서 해법 탐색기의 최단 풀이대로 눌러 보고, 판을 깬 것으로 저장되는지와 로봇이 충전 독에 올라앉는지 확인한다(2026-11-01).
  tools/verify.html은 규칙만 풀어 보므로, 화면 코드(그리기, 연출, 입력)가 판을 깨지 못하게 막는 문제는 이것으로 찾는다.
  headless Chrome에서 --dump-dom과 --virtual-time-budget=600000으로 돌리면 결과 줄(PASS 또는 FAIL)이 #out에 남는다. ?levels=0,3처럼 몇 판만 고를 수 있다.
  걸음 수 평가(2026-11-02)도 본다. 깬 뒤 저장된 가장 적은 걸음 수와 화면의 배터리 칸 수가 규칙(layout.js stepRating)과 맞아야 한다.
  ?wiggle=2처럼 짝수를 주면 풀이 앞에 물건을 밀지 않는 왕복 걸음을 그만큼 더해, 두 칸과 한 칸이 맞게 나오는지도 볼 수 있다.
-->
<style>
  body { margin: 0; background: #111; color: #eee; font: 14px monospace; }
  iframe { width: 1920px; height: 1080px; border: 0; display: block; }
</style>
</head>
<body>
<pre id="out">시작</pre>
<iframe id="game" title="game"></iframe>
<script src="../src/layout.js"></script>
<script src="../src/engine.js"></script>
<script>
  const KEYS = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' };
  const STORAGE_KEY = 'villain-settings-2';
  const levels = window.VILLAIN_LAYOUT.levels;
  const frame = document.getElementById('game');
  const out = document.getElementById('out');
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const params = new URLSearchParams(location.search);
  const picked = params.get('levels');
  const indices = picked ? picked.split(',').map(Number) : levels.map((_, index) => index);
  const wiggle = Number(params.get('wiggle') || 0);
  // ?size=375x812처럼 주면 게임 창 크기를 바꿔, 휴대폰 화면에서 판을 깬 모습도 찍어 볼 수 있다.
  const [frameWidth, frameHeight] = (params.get('size') || '1920x1080').split('x').map(Number);
  const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

  // 시작 자리에서 물건을 밀지 않고 갔다가 돌아올 수 있는 방향 하나를 찾아, 그 왕복을 count걸음만큼 만든다.
  function wiggleMoves(level, count) {
    if (count <= 0) return [];
    for (const direction of Object.keys(OPPOSITE)) {
      const there = VillainEngine.step(level, level.start, direction);
      if (!there.moved || there.pushed !== null || there.seen || there.won) continue;
      const back = VillainEngine.step(level, there.state, OPPOSITE[direction]);
      if (!back.moved || back.pushed !== null || back.seen) continue;
      if (VillainEngine.stateKey(back.state) !== VillainEngine.stateKey(level.start)) continue;
      return Array.from({ length: count }, (_, step) => (step % 2 === 0 ? direction : OPPOSITE[direction]));
    }
    return null;
  }

  // 걸음 수 평가 규칙(index.html cellsFor와 같다).
  function expectedCells(definition, steps) {
    if (steps <= definition.optimal) return 3;
    if (steps <= Math.floor(definition.optimal * window.VILLAIN_LAYOUT.stepRating.twoCells)) return 2;
    return 1;
  }

  async function playLevel(index) {
    frame.style.width = `${frameWidth}px`;
    frame.style.height = `${frameHeight}px`;
    const definition = levels[index];
    const parsed = VillainEngine.parseLevel(definition);
    const extra = wiggleMoves(parsed, wiggle);
    if (extra === null) return `SKIP ${definition.id} (왕복할 자리가 없음)`;
    const path = [...extra, ...(VillainEngine.solve(parsed).path || [])];
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    saved.cleared = levels.slice(0, index).map((level) => level.id);
    saved.lastLevel = index;
    saved.prologueSeen = true;
    saved.best = {};
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
    const loaded = new Promise((resolve) => { frame.onload = resolve; });
    frame.src = `../index.html?play=${index}-${Date.now()}`;
    await loaded;
    const press = (key) => frame.contentDocument.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
    await wait(800);
    press('Enter'); // 첫 화면 열기
    await wait(800);
    press('Enter'); // 이어하기
    await wait(2500);
    press('Enter'); // 챕터 첫 판의 빌런 소개 카드 닫기(카드가 없으면 시작 연출을 건너뜀)
    await wait(1500);
    press('Shift'); // 시연이나 시작 연출이 남아 있으면 건너뛴다(Shift는 다른 일을 하지 않는다)
    await wait(1500);
    press('Shift');
    await wait(1000);
    // 연출 중(촬영자가 떠날 때 같은)에 누른 키는 연출 건너뛰기로 쓰이고 걸음이 되지 않는다. 그래서 로봇이 실제로 움직였는지 보고, 안 움직였으면 다시 누른다.
    // 최단 풀이의 걸음은 모두 로봇을 옮기므로(밀기도 로봇이 한 칸 나아간다) 이 확인이 맞다.
    const spriteOf = (pattern) => {
      const image = [...frame.contentDocument.querySelectorAll('#scene img')].find((element) => pattern.test(element.getAttribute('src') || ''));
      return image && image.closest('.sprite');
    };
    const robotSpot = () => {
      const sprite = spriteOf(/player-/);
      return sprite ? sprite.style.transform : '';
    };
    for (const direction of path) {
      for (let attempt = 0; attempt < 8; attempt += 1) {
        const before = robotSpot();
        press(KEYS[direction]);
        await wait(350);
        if (robotSpot() !== before) break;
        await wait(600);
      }
    }
    // 2장과 3장은 빌런이 짐을 챙겨 떠나는 연출이 길어서, 깬 것이 저장될 때까지 넉넉히 기다린다(3초는 모자랐다).
    await wait(9000);
    const after = JSON.parse(frame.contentWindow.localStorage.getItem(STORAGE_KEY) || '{}');
    const cleared = (after.cleared || []).includes(definition.id);
    // 판 안에 충전 독(D)이 있는 판은 깬 뒤 로봇이 독 위에 올라앉았는지도 본다. 그림의 가로 가운데가 같고, 바닥선 차이가 칸의 20% 안이면 독 위다.
    const bottomCenter = (sprite) => {
      const match = /translate\(([-\d.]+)px, ([-\d.]+)px\)/.exec(sprite.style.transform);
      return { x: Number(match[1]) + sprite.offsetWidth / 2, bottom: Number(match[2]) + sprite.offsetHeight };
    };
    let docked = true;
    if (definition.map.some((line) => line.includes('D'))) {
      const dock = spriteOf(/\/dock\./);
      const robot = bottomCenter(spriteOf(/player-/));
      const seat = bottomCenter(dock);
      docked = Math.abs(robot.x - seat.x) < 1 && Math.abs(robot.bottom - seat.bottom) < dock.offsetHeight * 0.2;
    }
    // 걸음 수 평가: 저장된 가장 적은 걸음 수가 누른 걸음 수와 같고, 화면의 배터리 칸 수가 규칙과 같아야 한다.
    const best = (after.best || {})[definition.id];
    const battery = frame.contentDocument.querySelector('#result .result-battery');
    const cells = battery && !frame.contentDocument.getElementById('result').hidden ? Number(battery.dataset.cells) : 0;
    const expected = expectedCells(definition, path.length);
    const rated = best === path.length && cells === expected;
    const notes = [docked ? '' : '로봇이 독 위에 없음', rated ? '' : `평가 어긋남: 기록 ${best}, 칸 ${cells}, 기대 ${expected}`].filter(Boolean).join(', ');
    return `${cleared && docked && rated ? 'PASS' : 'FAIL'} ${definition.id} (${path.length}걸음, 배터리 ${cells}칸${notes ? `, ${notes}` : ''})`;
  }

  (async () => {
    const lines = [];
    for (const index of indices) {
      lines.push(await playLevel(index));
      out.textContent = lines.join('\n');
    }
    out.textContent = `${lines.every((line) => line.startsWith('PASS')) ? '모든 판 통과' : '실패한 판 있음'}\n${lines.join('\n')}`;
  })();
</script>
</body>
</html>
