<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>빌런 도감 검증</title>
  <style>
    body { margin: 0; padding: 20px; font: 14px/1.6 ui-monospace, Consolas, monospace; background: #1d1b19; color: #eee; }
    #summary { font-weight: bold; margin-bottom: 12px; }
    .fail { color: #ff8a80; }
  </style>
</head>
<body>
  <!-- 판마다 해법 탐색으로 최소 걸음 수와 민 횟수를 찾아 layout.js에 적은 값과 같은지 본다. -->
  <div id="summary">검증 중...</div>
  <pre id="log"></pre>
  <script src="../src/layout.js"></script>
  <script src="../src/engine.js"></script>
  <script>
    const lines = [];
    let failures = 0;
    function expect(condition, message) {
      lines.push(`${condition ? 'PASS' : 'FAIL'}  ${message}`);
      if (!condition) failures += 1;
    }
    // 물건을 바닥으로 보고 시작 자리에서 닿을 수 있는 칸 수. 둘레 밖의 막힌 바닥은 세지 않는다.
    function reachableCells(level) {
      const seen = new Set([`${level.start.player.x},${level.start.player.y}`]);
      const queue = [level.start.player];
      while (queue.length > 0) {
        const { x, y } = queue.shift();
        for (const { dx, dy } of Object.values(VillainEngine.DIRECTIONS)) {
          const nx = x + dx;
          const ny = y + dy;
          const key = `${nx},${ny}`;
          if (seen.has(key) || nx < 0 || ny < 0 || nx >= level.width || ny >= level.height) continue;
          if (level.walls.has(key) || (level.villain.x === nx && level.villain.y === ny)) continue;
          seen.add(key);
          queue.push({ x: nx, y: ny });
        }
      }
      return seen.size;
    }

    function chairCells(definition) {
      const cells = [];
      definition.map.forEach((line, y) => [...line].forEach((char, x) => {
        if (char === 'c') cells.push([x, y]);
      }));
      return cells;
    }

    // 시작에서 물건을 밀지 않고 걸어서 갈 수 있는 모든 자리에서, 처음 미는 수를 모두 찾아 그 뒤에 풀리는지 본다.
    function firstPushOutcomes(level) {
      const keyOf = (state) => `${state.player.x},${state.player.y}|${state.items.map((item) => `${item.kind}${item.x},${item.y}`).sort().join(';')}`;
      const seen = new Set([keyOf(level.start)]);
      const queue = [level.start];
      const firsts = new Map();
      while (queue.length > 0) {
        const state = queue.shift();
        for (const direction of Object.keys(VillainEngine.DIRECTIONS)) {
          const result = VillainEngine.step(level, state, direction);
          if (!result.moved) continue;
          const key = keyOf(result.state);
          if (result.pushed !== null) {
            firsts.set(key, result);
          } else if (!seen.has(key)) {
            seen.add(key);
            queue.push(result.state);
          }
        }
      }
      let dead = 0;
      for (const result of firsts.values()) {
        if (!result.won && VillainEngine.solve({ ...level, start: result.state }).moves === null) dead += 1;
      }
      return { total: firsts.size, dead };
    }

    // 배경에 그려진 것(테이블, 화분, 빌런, 진동벨 자리)만 남긴 지도. 같은 배경을 쓰는 레벨은 이것이 같아야 그림과 막히는 칸이 맞는다.
    const fixedOf = (map) => map.map((line) => line.replace(/[^TLV*#]/g, '.')).join('\n');
    const firstOfBg = {};
    const chapterIds = window.VILLAIN_LAYOUT.chapters.map((chapter) => chapter.id);
    for (const definition of window.VILLAIN_LAYOUT.levels) {
      const level = VillainEngine.parseLevel(definition);
      const result = VillainEngine.solve(level);
      expect(result.moves === definition.optimal && result.pushes === definition.pushes,
        `${definition.id}: 최소 ${result.moves}걸음, 밀기 ${result.pushes}번 (기록된 값 ${definition.optimal}걸음, ${definition.pushes}번) [${(result.path || []).join(' ')}]`);
      expect(chapterIds.includes(definition.chapter), `${definition.id}: 챕터 ${definition.chapter}가 chapters에 있음`);
      if (firstOfBg[definition.bg]) {
        expect(fixedOf(definition.map) === fixedOf(firstOfBg[definition.bg].map),
          `${definition.id}: 배경 bg-${definition.bg}의 테이블, 화분, 빌런 자리가 ${firstOfBg[definition.bg].id}와 같음`);
      } else {
        firstOfBg[definition.bg] = definition;
      }
      if (definition.chairNeeded) {
        const fixedChairs = VillainEngine.parseLevel({ ...definition, map: definition.map.map((line) => line.replace(/c/g, '#')) });
        expect(VillainEngine.solve(fixedChairs).moves === null, `${definition.id}: 의자를 밀지 않으면 풀리지 않음`);
      }
      // 판에 놓은 의자는 하나씩 벽으로 바꿔 봤을 때 풀리지 않거나 최소 걸음이 달라져야 한다(known-issues 17번).
      // 2장의 예전 레벨은 의자를 밀지 않고 그늘로만 쓰므로, 새 계획으로 만든 레벨(kind가 있는 레벨)만 본다.
      if (definition.kind) chairCells(definition).forEach(([x, y]) => {
        const map = definition.map.map((line, row) => (row === y ? line.slice(0, x) + '#' + line.slice(x + 1) : line));
        const moves = VillainEngine.solve(VillainEngine.parseLevel({ ...definition, map })).moves;
        expect(moves !== result.moves, `${definition.id}: (${x}, ${y}) 의자가 풀이에 쓰임`);
      });
      // 튜토리얼은 망치는 첫 수가 없어야 하고, 퍼즐은 있어야 한다. 퍼즐은 걸을 수 있는 칸이 35칸 이하다(docs/level-design.md).
      if (definition.kind) {
        const firsts = firstPushOutcomes(level);
        if (definition.kind === 'tutorial') {
          expect(firsts.dead === 0, `${definition.id}: 튜토리얼이라 처음 미는 수 ${firsts.total}개 가운데 망치는 수가 없음 (${firsts.dead}개)`);
        } else {
          const walkable = reachableCells(level);
          expect(firsts.dead >= 1, `${definition.id}: 퍼즐이라 처음 미는 수 ${firsts.total}개 가운데 망치는 수가 있음 (${firsts.dead}개)`);
          expect(walkable <= 35, `${definition.id}: 걸을 수 있는 칸 ${walkable}칸이 35칸 이하`);
        }
      }
      if (level.view) {
        expect(!VillainEngine.viewOf(level, level.start).hits.includes('player'), definition.id + ': 시작하자마자 화각에 잡히지 않음');
      }
      const columns = window.VILLAIN_LAYOUT.art.columns;
      const rows = window.VILLAIN_LAYOUT.art.rows;
      expect(definition.map.length === rows && definition.map.every((line) => line.length === columns),
        `${definition.id}: 지도가 배치 숫자와 같은 ${columns} x ${rows}칸`);
    }
    document.getElementById('summary').textContent = failures === 0 ? '모든 검증 통과' : `실패 ${failures}개`;
    document.getElementById('summary').className = failures === 0 ? '' : 'fail';
    document.getElementById('log').textContent = lines.join('\n');
  </script>
</body>
</html>
