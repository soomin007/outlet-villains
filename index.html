<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>콘센트 빌런 도감</title>
  <style>
    /* 콘센트 빌런 도감 첫 판. 콘셉트와 그림 규칙은 docs/concept.md에 있다.
       그림이 없는 동안은 테마별 색 규칙대로 칠한 상자로 보인다. 글은 넣지 않는다. */
    :root {
      --page: #1d1b19;
      --ink: #111;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      color: #eee;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    [hidden] { display: none !important; }

    /* 화면 전체를 쓴다. 장면은 남는 자리(.stage)의 가로와 세로 가운데 좁은 쪽에 맞춰 키운다. */
    .wrap {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-left: 20px;
      padding-right: 20px;
      padding-top: 12px;
      padding-bottom: 16px;
    }

    .bar {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 10px;
      flex: none;
    }

    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn {
      min-width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 3px solid #eee;
      background: #2b2826;
      font-size: 20px;
      font-weight: 800;
    }

    .btn:disabled { opacity: 0.35; cursor: default; }
    .btn.off { opacity: 0.45; }

    /* 장면은 960 x 540 좌표로 그리고 화면에 맞춰 키우거나 줄인다. 그림 아래쪽의 빈 띠는 잘라 낸다(layout.js의 viewBottom). */
    .viewport {
      position: relative;
      flex: none;
      overflow: hidden;
      border-radius: 10px;
    }

    .scene {
      position: absolute;
      left: 0;
      top: 0;
      width: 960px;
      height: 540px;
      transform-origin: 0 0;
      overflow: hidden;
    }

    /* 배경 그림은 채도와 대비를 낮춰 뒤로 물린다. 움직일 수 있는 것, 주인공, 빌런이 앞으로 나오게 한다(2026-10-30 사용자 피드백). */
    .backdrop img {
      filter: saturate(0.6) contrast(0.78) brightness(1.08);
    }

    .layer,
    .backdrop img {
      position: absolute;
      left: 0;
      top: 0;
      width: 960px;
      height: 540px;
    }

    .box {
      position: absolute;
    }

    .sprite {
      position: absolute;
      left: 0;
      top: 0;
      transition: transform 130ms linear, opacity 0.5s ease;
    }

    .instant .sprite { transition: none !important; }

    .sprite img {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 상호작용할 수 있는 것에는 게임이 흰 스티커 테두리와 약한 그림자를 붙인다(예전 카페 버전의 원칙 그대로). */
    .sprite.sticker .art {
      filter:
        drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)
        drop-shadow(0 3px 2px rgba(0, 0, 0, 0.35));
    }

    .art {
      width: 100%;
      height: 100%;
    }

    /* 그림이 없을 때의 상자 */
    .gbox {
      width: 100%;
      height: 100%;
      border: 3px solid var(--ink);
      border-radius: 10px;
    }

    .gbox.round { border-radius: 50% 50% 40% 40%; }

    /* 그림이 없을 때 쓰레기통은 좁고 위가 둥근 통으로 그려 의자(네모)와 진동벨(동그라미)과 구분한다. */
    .kind-trash .gbox {
      width: 64%;
      margin-left: 18%;
      border-radius: 40% 40% 8px 8px;
    }

    /* 손님과 카페 테이블 상자(그림이 오기 전). 손님은 위가 둥근 사람 모양이고, 보는 쪽에 진한 점(얼굴)이 있다. */
    .kind-customer .gbox {
      position: relative;
      border-width: 2px;
      border-radius: 45% 45% 8px 8px;
    }

    .kind-customer .gbox::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 30%;
      width: 26%;
      height: 17%;
      margin-left: -13%;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
    }

    .kind-customer[data-facing="up"] .gbox::after { top: 6%; }
    .kind-customer[data-facing="down"] .gbox::after { top: 40%; }
    .kind-customer[data-facing="left"] .gbox::after { left: 22%; }
    .kind-customer[data-facing="right"] .gbox::after { left: 78%; }

    /* 손님, 테이블, 소품은 배경이라 채도와 대비를 낮춰 뒤로 물린다. 움직일 수 있는 것과 주인공이 앞으로 나온다. */
    .kind-customer .art,
    .kind-table .art,
    .kind-decor .art {
      filter: saturate(0.75) contrast(0.82) brightness(1.04);
    }

    /* 주인공 발밑의 둥근 표시. 주인공 색으로 천천히 숨 쉬듯 커졌다 작아진다. */
    .sprite.is-player::before {
      content: "";
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: -6%;
      height: 26%;
      border: 3px solid var(--player-color);
      border-radius: 50%;
      background: color-mix(in srgb, var(--player-color) 22%, transparent);
      z-index: -1;
      animation: player-ring 1.6s ease-in-out infinite alternate;
    }

    @keyframes player-ring {
      from { transform: scale(0.88); opacity: 0.65; }
      to { transform: scale(1.06); opacity: 1; }
    }

    .kind-decor .gbox {
      border-width: 2px;
      border-radius: 40% 40% 12px 12px;
      width: 70%;
      height: 80%;
      margin-left: 15%;
      margin-top: 20%;
    }

    .kind-table .gbox {
      border-width: 2px;
      border-radius: 6px;
      width: 84%;
      height: 70%;
      margin-left: 8%;
      margin-top: 18%;
    }

    .sprite.hop .art {
      animation: hop 130ms ease;
    }

    @keyframes hop {
      50% { transform: translateY(-4px); }
    }

    .sprite.ringing .art {
      animation: ring 0.12s linear 6;
    }

    @keyframes ring {
      25% { transform: translateX(-3px) rotate(-6deg); }
      75% { transform: translateX(3px) rotate(6deg); }
    }

    .sprite.gone { opacity: 0; }

    /* 카메라 화각. 방송 화면에 비치는 칸이다. 들킬 뻔하면 잠깐 붉어진다. */
    .view-cell {
      position: absolute;
      background: rgba(255, 210, 60, 0.32);
      box-shadow: inset 0 0 0 1px rgba(255, 210, 60, 0.55);
      z-index: 5;
      transition: background 0.15s ease;
    }

    .scene.seen .view-cell { background: rgba(217, 60, 50, 0.45); }

    /* 레벨 점. 챕터 번호 옆에 그 챕터의 레벨 점이 붙는다. 지금 레벨은 채운 점, 깬 레벨은 초록으로 채운다. */
    .dots {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      margin-right: auto;
      align-items: center;
      min-width: 0;
    }

    .dot-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .dot-chapter {
      font-size: 14px;
      font-weight: 900;
      margin-right: 2px;
    }

    .dot {
      width: 18px;
      height: 18px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid #eee;
      background: transparent;
    }

    .dot.current { background: #eee; }
    .dot.cleared { border-color: #7fd3b8; }
    .dot.cleared:not(.current) { background: #2f5e4a; }

    .scene.bump { animation: bump 0.12s ease; }

    @keyframes bump {
      50% { transform: var(--fit) translateX(2px); }
    }

    /* 판을 깨면 빌런 반응 일러스트가 크게 뜬다 */
    /* 반응 일러스트는 빌런 반대쪽에 뜬다(빌런과 콘센트가 바뀌는 모습을 가리지 않게). 뜨는 동안 장면은 살짝 어두워진다. */
    .portrait {
      position: absolute;
      right: 40px;
      bottom: 0;
      z-index: 240;
      width: 400px;
      height: 400px;
      transform: translateY(110%);
      transition: transform 0.45s cubic-bezier(0.2, 1.4, 0.4, 1);
      pointer-events: none;
    }

    .portrait.left {
      right: auto;
      left: 40px;
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 235;
      background: rgba(0, 0, 0, 0.35);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .scene.cut-in::after { opacity: 1; }

    .portrait.show { transform: translateY(0); }

    .flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
    }

    .flash.go { animation: flash 0.5s ease; }

    @keyframes flash {
      0% { opacity: 0.7; }
      100% { opacity: 0; }
    }

    /* 판을 깬 뒤: 아무 키나 누르거나 화면을 누르면 다음 판으로 간다는 표시. 판 가운데 오른쪽에서 깜박인다. */
    .next-cue {
      position: absolute;
      right: 36px;
      top: 50%;
      width: 64px;
      height: 64px;
      margin-top: -32px;
      z-index: 260;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #111;
      border-radius: 50%;
      background: #fff;
      color: #111;
      font-size: 28px;
      font-weight: 900;
      padding-left: 5px;
      animation: cue 0.9s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes cue {
      from { transform: translateX(0); }
      to { transform: translateX(8px); }
    }

    /* 판을 시작할 때 목표를 짚는다: 빌런 자리 콘센트에 고리가 퍼지고, 주인공 머리 위에 뽑힌 내 충전기가 잠깐 뜬다. */
    .sprite.pulse::before {
      content: "";
      position: absolute;
      inset: -6px;
      border: 4px solid #ffd23c;
      border-radius: 50%;
      animation: pulse 0.9s ease-out 2;
    }

    @keyframes pulse {
      from { transform: scale(0.6); opacity: 1; }
      to { transform: scale(1.5); opacity: 0; }
    }

    .plug-bubble {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #111;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 0.6s ease-in-out infinite alternate;
    }

    .plug-bubble .art { width: 18px; height: 18px; }

    @keyframes float {
      from { margin-top: 0; }
      to { margin-top: -5px; }
    }

    /* 첫 판 조작키. 키보드가 있는 화면에서만, 몇 걸음 움직이면 사라진다. 글 대신 키 모양만 보여 준다. */
    .keys-hint {
      position: absolute;
      z-index: 210;
      display: grid;
      grid-template-columns: repeat(3, 22px);
      grid-template-rows: repeat(2, 22px) 8px 22px;
      gap: 3px;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .keys-hint.fade { opacity: 0; }

    .keycap {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #111;
      border-bottom-width: 4px;
      border-radius: 5px;
      background: #fff;
      color: #111;
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
    }

    .keycap.up { grid-column: 2; grid-row: 1; }
    .keycap.left { grid-column: 1; grid-row: 2; }
    .keycap.down { grid-column: 2; grid-row: 2; }
    .keycap.right { grid-column: 3; grid-row: 2; }
    .keycap.undo { grid-column: 1 / span 2; grid-row: 4; }
    .keycap.restart { grid-column: 3; grid-row: 4; }

    /* 새 기믹 시연. 반투명한 주인공이 한 번 해 보인다. 아무 키나 누르면 넘어간다. */
    .sprite.ghost {
      opacity: 0.5;
      z-index: 220 !important;
      transition: transform 0.35s ease, opacity 0.3s ease;
    }

    /* 1번 판 목표: 진동벨이 들어갈 칸의 점선 윤곽. 진동벨이 한 칸 앞에 오면 밝아진다. */
    .goal-mark {
      position: absolute;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .goal-mark::after {
      content: "";
      width: 62%;
      height: 62%;
      border-radius: 50%;
      border: 3px dashed rgba(255, 210, 60, 0.85);
    }

    .goal-mark.near::after {
      border-style: solid;
      background: rgba(255, 210, 60, 0.3);
      animation: pulse-soft 0.8s ease-in-out infinite alternate;
    }

    @keyframes pulse-soft {
      from { transform: scale(0.92); }
      to { transform: scale(1.08); }
    }

    /* 2, 3번 판: 유튜버의 방송 화면 창. 카메라가 지금 비추는 것(빌런 얼굴과 등 뒤 세 줄에서 처음 닿는 것)이 그대로 보인다. */
    /* 판 오른쪽 옆벽 자리(장면 x 774~960)에 둔다. 왼쪽 위에 두면 판의 첫 칸을 덮었다. */
    .stream {
      position: absolute;
      right: 12px;
      top: 12px;
      width: 164px;
      height: 92px;
      z-index: 230;
      border: 3px solid #111;
      border-radius: 10px;
      background: #2b2b2b;
      overflow: hidden;
    }

    .stream .frame-art {
      position: absolute;
      inset: 0;
    }

    .stream .live {
      position: absolute;
      left: 8px;
      top: 8px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e0362c;
      animation: blink 1s steps(2) infinite;
    }

    @keyframes blink {
      50% { opacity: 0.2; }
    }

    .stream .slots {
      position: absolute;
      left: 24px;
      right: 24px;
      top: 12px;
      height: 38px;
      display: flex;
      gap: 6px;
    }

    .stream .slot {
      flex: 1;
      border-radius: 6px;
      background: #4a4a4a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stream .slot .art { width: 30px; height: 30px; }

    .stream .face {
      position: absolute;
      left: 50%;
      bottom: -12px;
      width: 54px;
      height: 54px;
      transform: translateX(-50%);
    }

    .stream.chaos {
      animation: chaos 0.1s linear 8;
      border-color: #e0362c;
    }

    @keyframes chaos {
      25% { transform: translate(-3px, 2px) rotate(-2deg); }
      75% { transform: translate(3px, -2px) rotate(2deg); }
    }

    /* 방향 버튼은 터치 화면에서만 보인다. 키보드와 마우스가 있는 화면에서는 세로 자리만 차지했다. */
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 56px);
      gap: 6px;
      justify-content: center;
      margin-top: 14px;
      flex: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .pad { display: none; }
    }

    /* 조작법 안내. 판 오른쪽 옆벽(장면 x 774~960)은 어느 배경에서나 늘 비는 자리라 거기에 둔다(2026-10-29 사용자 요청).
       Baba Is You처럼 글자마다 0.2초씩 세 모양을 오가며 꼬물거린다. 키보드가 없는 화면에서는 방향 버튼이 대신하므로 숨긴다. */
    .side-keys {
      position: absolute;
      left: 776px;
      top: 150px;
      width: 172px;
      z-index: 225;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 16px;
      text-align: right;
      opacity: 0.55;
      pointer-events: none;
      color: #f6efe2;
      font-size: 17px;
      font-weight: 900;
      text-shadow: 0 2px 0 #111, 2px 0 0 #111, -2px 0 0 #111, 0 -2px 0 #111;
    }

    .side-keys .key {
      display: inline-block;
      min-width: 30px;
      margin-right: 8px;
      padding-left: 6px;
      padding-right: 6px;
      border: 2px solid #f6efe2;
      border-bottom-width: 4px;
      border-radius: 6px;
      background: rgba(17, 17, 17, 0.6);
      box-shadow: 0 0 0 2px #111;
      font-size: 14px;
      line-height: 22px;
      text-align: center;
    }

    /* 꼬물거림은 눈에 거슬리지 않을 만큼만: 0.3px 안쪽으로 움직이고 1.2도 안쪽으로 기운다(2026-10-30 사용자 피드백). */
    .wob {
      display: inline-block;
      animation: wobble 0.75s steps(1) infinite;
    }

    @keyframes wobble {
      0% { transform: translate(0, 0) rotate(0); }
      33% { transform: translate(0.3px, -0.3px) rotate(-1.2deg); }
      66% { transform: translate(-0.3px, 0.2px) rotate(1deg); }
    }

    @media (hover: none), (pointer: coarse) {
      .side-keys { display: none; }
    }

    .pad .btn {
      width: 56px;
      height: 56px;
    }

    .pad [data-dir="up"] { grid-column: 2; grid-row: 1; }
    .pad [data-dir="left"] { grid-column: 1; grid-row: 2; }
    .pad [data-dir="down"] { grid-column: 2; grid-row: 2; }
    .pad [data-dir="right"] { grid-column: 3; grid-row: 2; }

    /* 내 폰 배터리. 레벨을 시작하면 1%로 깜박이고, 빌런이 떠나 내 충전기가 꽂히면 가득 찬다. 왜 콘센트가 필요한지 보여 준다. */
    .battery {
      position: relative;
      flex: none;
      width: 46px;
      height: 24px;
      margin-right: 8px;
      align-self: center;
      border: 3px solid #eee;
      border-radius: 6px;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -8px;
      top: 5px;
      width: 4px;
      height: 8px;
      border-radius: 0 3px 3px 0;
      background: #eee;
    }

    .battery-fill {
      position: absolute;
      left: 2px;
      top: 2px;
      bottom: 2px;
      width: 4px;
      border-radius: 2px;
      background: #e0362c;
      transition: width 1.2s ease, background 1.2s ease;
      animation: blink 1s steps(2) infinite;
    }

    .battery.full .battery-fill {
      width: calc(100% - 4px);
      background: #7fd3b8;
      animation: none;
    }

    .battery-bolt {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .battery.full .battery-bolt { opacity: 1; }

    /* 빌런의 충전 선. 벽 콘센트에서 빌런의 멀티탭이나 장비까지 이어져, 콘센트를 누가 차지했는지 보인다. */
    .cord {
      position: absolute;
      left: 0;
      top: 0;
      width: 960px;
      height: 540px;
      pointer-events: none;
      overflow: visible;
      transition: opacity 0.5s ease;
    }

    .cord path {
      fill: none;
      stroke-linecap: round;
    }

    .cord.pulse .cord-glow {
      animation: cord-glow 0.9s ease-in-out 2;
    }

    @keyframes cord-glow {
      50% { stroke: #ffd23c; stroke-width: 9px; }
    }

    .cord.gone { opacity: 0; }

    /* 진동벨은 몇 초마다 부르르 떨고 양옆에 진동 표시가 뜬다. 같은 색의 의자와 구별되고, 무엇인지 읽히게 한다. */
    .sprite.kind-buzzer:not(.ringing) .art {
      animation: buzz 2.4s linear infinite;
    }

    @keyframes buzz {
      0%, 14%, 100% { transform: none; }
      2%, 6%, 10% { transform: translateX(-2px) rotate(-7deg); }
      4%, 8%, 12% { transform: translateX(2px) rotate(7deg); }
    }

    .sprite.kind-buzzer::before,
    .sprite.kind-buzzer::after {
      content: "";
      position: absolute;
      top: 22%;
      width: 22%;
      height: 50%;
      border: 0 solid #111;
      border-radius: 50%;
      opacity: 0;
      animation: buzz-marks 2.4s linear infinite;
      pointer-events: none;
    }

    .sprite.kind-buzzer::before { left: -12%; border-left-width: 3px; }
    .sprite.kind-buzzer::after { right: -12%; border-right-width: 3px; }

    .sprite.kind-buzzer.ringing::before,
    .sprite.kind-buzzer.ringing::after {
      animation: none;
      opacity: 1;
    }

    @keyframes buzz-marks {
      0%, 15%, 100% { opacity: 0; }
      1%, 13% { opacity: 1; }
    }

    /* 프롤로그, 챕터 소개, 엔딩 카드. 장면 위를 덮고, 아무 키나 누르면 넘어간다. */
    .card {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(20, 18, 16, 0.88);
      border-radius: 10px;
      cursor: pointer;
      animation: card-in 0.3s ease;
    }

    @keyframes card-in {
      from { opacity: 0; }
    }

    .card-body {
      display: flex;
      align-items: center;
      gap: 32px;
      max-width: 880px;
      padding-left: 24px;
      padding-right: 24px;
    }

    .card-art {
      flex: none;
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }

    .card-art img {
      display: block;
      height: min(46vh, 340px);
      width: auto;
    }

    .card-art img.small { height: min(24vh, 160px); }

    /* 만화 프롤로그 컷: 글 없이 그림만 크게 보인다. */
    .card.comic .card-text { display: none; }

    .card-art img.comic {
      width: min(90vw, 1120px);
      height: auto;
      max-height: 78vh;
      object-fit: contain;
      border: 4px solid #111;
      border-radius: 10px;
    }

    .card-kicker {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 800;
      color: #ffd23c;
    }

    .card-title {
      margin: 0 0 14px;
      font-size: clamp(24px, 4vw, 40px);
      line-height: 1.2;
      font-weight: 900;
      word-break: keep-all;
    }

    .card-lines p {
      margin: 0 0 8px;
      font-size: clamp(16px, 1.8vw, 21px);
      line-height: 1.55;
      word-break: keep-all;
    }

    .card-next {
      position: absolute;
      right: 24px;
      bottom: 18px;
      font-size: 22px;
      animation: cue 0.9s ease-in-out infinite alternate;
    }

    /* 큰 배터리 그림(프롤로그 첫 장) */
    .big-battery {
      position: relative;
      width: 150px;
      height: 76px;
      margin-right: 20px;
      border: 7px solid #eee;
      border-radius: 14px;
    }

    .big-battery::after {
      content: "";
      position: absolute;
      right: -20px;
      top: 18px;
      width: 10px;
      height: 26px;
      border-radius: 0 6px 6px 0;
      background: #eee;
    }

    .big-battery span {
      position: absolute;
      left: 5px;
      top: 5px;
      bottom: 5px;
      width: 10px;
      border-radius: 4px;
      background: #e0362c;
      animation: blink 1s steps(2) infinite;
    }

    @media (max-width: 640px) {
      .card-body {
        flex-direction: column;
        gap: 16px;
        text-align: center;
      }

      .card-art img { height: min(28vh, 200px); }
      .card-art img.comic { width: 100%; height: auto; }
      .card.comic .card-body { padding-left: 6px; padding-right: 6px; }
      .card-art img.small { height: min(16vh, 110px); }
    }

    /* 설정창. 화면 전체를 덮는 창이고, Esc나 닫기로 닫는다. */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 20px;
      padding-right: 20px;
      background: rgba(0, 0, 0, 0.6);
    }

    .panel {
      width: 100%;
      max-width: 460px;
      max-height: calc(100dvh - 40px);
      overflow-y: auto;
      padding: 20px 22px;
      border: 3px solid #eee;
      border-radius: 14px;
      background: #2b2826;
    }

    .panel h2 { margin: 0 0 14px; font-size: 22px; }
    .panel h3 { margin: 18px 0 8px; font-size: 16px; }

    .panel .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
    }

    .panel .row > span {
      flex: none;
      width: 72px;
    }

    .nw { white-space: nowrap; }

    .panel input[type="range"] {
      flex: 1;
      min-width: 0;
      max-width: 240px;
      accent-color: #7fd3b8;
    }

    .seg { display: flex; gap: 6px; }

    .seg button,
    .panel-actions button {
      min-height: 40px;
      padding-left: 14px;
      padding-right: 14px;
      border: 2px solid #eee;
      border-radius: 10px;
      background: transparent;
      font-weight: 800;
    }

    .seg button.on,
    .panel-actions .primary {
      background: #eee;
      color: #111;
    }

    .key-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .key-table th {
      width: 72px;
      padding: 6px 8px 6px 0;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }

    .key-table td { padding-top: 6px; padding-bottom: 6px; line-height: 1.8; }

    kbd {
      display: inline-block;
      min-width: 22px;
      padding: 0 5px;
      border: 2px solid #eee;
      border-bottom-width: 3px;
      border-radius: 5px;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      line-height: 18px;
    }

    .panel-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .panel-actions .wide { flex: 1; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="bar">
      <div id="battery" class="battery" aria-label="로봇 배터리"><span class="battery-fill"></span><span class="battery-bolt">⚡</span></div>
      <nav id="dots" class="dots" aria-label="레벨 고르기"></nav>
      <button id="undo" class="btn" type="button" aria-label="되돌리기">↶</button>
      <button id="restart" class="btn" type="button" aria-label="처음부터">↻</button>
      <button id="open-settings" class="btn" type="button" aria-label="설정">⚙</button>
    </div>
    <div id="stage" class="stage">
      <!-- 프롤로그, 챕터 소개, 엔딩 카드. 장면과 달리 줄어들지 않아 휴대폰에서도 글이 읽힌다. -->
      <div id="card" class="card" hidden>
        <div class="card-body">
          <div class="card-art"></div>
          <div class="card-text">
            <p class="card-kicker"></p>
            <h2 class="card-title"></h2>
            <div class="card-lines"></div>
          </div>
        </div>
        <div class="card-next">▶</div>
      </div>
      <div id="viewport" class="viewport">
        <div id="scene" class="scene">
          <div id="backdrop" class="layer backdrop"></div>
          <div id="view" class="layer"></div>
          <div id="actors" class="layer"></div>
          <div id="flash" class="flash"></div>
          <div id="portrait" class="portrait"></div>
          <div id="next-cue" class="next-cue" hidden>▶</div>
          <div id="side-keys" class="side-keys" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <div id="pad" class="pad">
      <button class="btn" type="button" data-dir="up" aria-label="위">▲</button>
      <button class="btn" type="button" data-dir="left" aria-label="왼쪽">◀</button>
      <button class="btn" type="button" data-dir="down" aria-label="아래">▼</button>
      <button class="btn" type="button" data-dir="right" aria-label="오른쪽">▶</button>
    </div>
  </main>

  <div id="settings" class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <div class="panel">
      <h2 id="settings-title">설정</h2>
      <div class="row">
        <span>그림체</span>
        <div class="seg">
          <button type="button" data-theme="a">흑백</button>
          <button type="button" data-theme="b">카툰</button>
        </div>
      </div>
      <label class="row"><span>화면 밝기</span><input id="set-brightness" type="range" min="60" max="140" step="5"></label>
      <label class="row"><span>음악</span><input id="set-music" type="range" min="0" max="100" step="5"></label>
      <label class="row"><span>효과음</span><input id="set-sfx" type="range" min="0" max="100" step="5"></label>
      <h3>조작법</h3>
      <table class="key-table">
        <tr><th>이동</th><td><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 또는 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd></td></tr>
        <tr><th>되돌리기</th><td><kbd>Z</kbd> 또는 <kbd>Backspace</kbd>, <span class="nw">위쪽 <kbd>↶</kbd> 버튼</span></td></tr>
        <tr><th>처음부터</th><td><kbd>R</kbd>, <span class="nw">위쪽 <kbd>↻</kbd> 버튼</span></td></tr>
        <tr><th>넘기기</th><td><span class="nw">아무 키나</span> <span class="nw">화면 누르기</span></td></tr>
        <tr><th>설정</th><td><kbd>Esc</kbd>, <span class="nw">위쪽 <kbd>⚙</kbd> 버튼</span></td></tr>
        <tr><th>휴대폰</th><td><span class="nw">화면 아래</span> <span class="nw">방향 버튼</span></td></tr>
      </table>
      <div class="panel-actions">
        <button id="replay-prologue" type="button" class="wide">프롤로그 다시 보기</button>
        <button id="close-settings" type="button" class="wide primary">닫기</button>
      </div>
    </div>
  </div>

  <script src="src/layout.js"></script>
  <script src="src/engine.js"></script>
  <script src="assets/manifest.js"></script>
  <script src="assets/bg-grid.js"></script>
  <script>
    (function () {
      'use strict';

      const Engine = window.VillainEngine;
      const LAYOUT = window.VILLAIN_LAYOUT;
      // 그림 좌표(1920 x 1080)를 장면 좌표(960 x 540)로 줄이는 비율
      const SCALE = 0.5;
      // 칸의 크기와 판의 왼쪽 위 모서리. 기본값은 layout.js의 숫자이고, 배경 그림이 있으면 그 그림의 실제 바닥 격자로 바꾼다.
      // 이미지 생성기가 배치 안내 그림을 정확히 지키지 못해서, 그림을 늘이지 않고 게임이 그림의 격자를 따른다(known-issues 14번).
      // TILE은 칸의 가로(그림 크기도 이 값을 기준으로 한다), TILE_H는 칸의 세로다.
      let TILE = LAYOUT.art.tile * SCALE;
      let TILE_H = TILE;
      let ORIGIN_X = LAYOUT.art.originX * SCALE;
      let ORIGIN_Y = LAYOUT.art.originY * SCALE;
      // 장면에서 보여 주는 높이. 그림 아래쪽의 어두운 띠를 잘라 낸다.
      const SCENE_H = LAYOUT.art.viewBottom * SCALE;
      const STORAGE_KEY = 'villain-settings-2';

      // 그림이 없을 때 상자에 칠하는 테마별 색. 색 규칙은 docs/concept.md "그림체 시험 결과와 결정" 절과 같다.
      const THEMES = {
        a: { floor: '#e6e6e2', grid: '#b8b8b4', wall: '#3a3a3a', side: '#5a5a5a', table: '#9a9a9a', plant: '#6f6f6f',
          player: '#c8302a', item: '#2f7a54', villain: '#cfcfcf', outletTheirs: '#9a9a9a', outletMine: '#c8302a', customer: '#b8b8b4' },
        b: { floor: '#e8d6b4', grid: '#d2bd96', wall: '#c99a6b', side: '#b98f68', table: '#a9805c', plant: '#7f9a72',
          player: '#7fd3b8', item: '#e8833a', villain: '#2f5e4a', outletTheirs: '#2f5e4a', outletMine: '#7fd3b8', customer: '#c9b79c' },
      };

      const ui = {
        stage: document.getElementById('stage'),
        viewport: document.getElementById('viewport'),
        nextCue: document.getElementById('next-cue'),
        scene: document.getElementById('scene'),
        backdrop: document.getElementById('backdrop'),
        actors: document.getElementById('actors'),
        view: document.getElementById('view'),
        dots: document.getElementById('dots'),
        flash: document.getElementById('flash'),
        portrait: document.getElementById('portrait'),
        undo: document.getElementById('undo'),
        restart: document.getElementById('restart'),
        battery: document.getElementById('battery'),
        card: document.getElementById('card'),
        cardArt: document.querySelector('#card .card-art'),
        cardKicker: document.querySelector('#card .card-kicker'),
        cardTitle: document.querySelector('#card .card-title'),
        cardLines: document.querySelector('#card .card-lines'),
        openSettings: document.getElementById('open-settings'),
        settings: document.getElementById('settings'),
        themeButtons: [...document.querySelectorAll('#settings [data-theme]')],
        setBrightness: document.getElementById('set-brightness'),
        setMusic: document.getElementById('set-music'),
        setSfx: document.getElementById('set-sfx'),
        replayPrologue: document.getElementById('replay-prologue'),
        closeSettings: document.getElementById('close-settings'),
      };

      const settings = loadSettings();
      if (settings.music === 80 && settings.sfx === 80) {
        settings.music = 60;
        settings.sfx = 50;
      }
      const game = {
        index: 0, level: null, state: null, history: [], busy: false, won: false, sprites: {}, cleared: new Set(),
        skip: false, steps: 0, lastStarted: -1, closeCard: null,
      };

      // 밝기는 %, 음악과 효과음은 0~100이다.
      function loadSettings() {
        const defaults = { theme: 'a', brightness: 100, music: 60, sfx: 50, keysSeen: false, demosSeen: [], prologueSeen: false };
        try {
          return { ...defaults, ...JSON.parse(localStorage.getItem(STORAGE_KEY)) };
        } catch (error) {
          return defaults;
        }
      }

      function saveSettings() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        } catch (error) {
          // 저장하지 못해도 이번 플레이에는 영향이 없다.
        }
      }

      function assetPath(key) {
        const themeAssets = (window.VILLAIN_ASSETS || {})[settings.theme] || {};
        return themeAssets[key] || null;
      }

      // 그림이 있으면 그림을, 없으면 색 상자를 돌려준다.
      function art(key, color, round) {
        const path = assetPath(key);
        if (path) return `<img class="art" src="${path}" alt="" draggable="false">`;
        return `<div class="art"><div class="gbox${round ? ' round' : ''}" style="background:${color}"></div></div>`;
      }

      // 장면을 남는 자리의 가로와 세로 가운데 좁은 쪽에 맞춘다. 장면 아래쪽 빈 띠(viewBottom 아래)는 보여 주지 않는다.
      function fitScene() {
        const scale = Math.min(ui.stage.clientWidth / 960, ui.stage.clientHeight / SCENE_H);
        ui.viewport.style.width = `${960 * scale}px`;
        ui.viewport.style.height = `${SCENE_H * scale}px`;
        ui.scene.style.height = `${SCENE_H}px`;
        ui.scene.style.setProperty('--fit', `scale(${scale})`);
        ui.scene.style.transform = `scale(${scale})`;
      }

      // 지금 레벨의 정의와 그 레벨이 속한 챕터(빌런). layout.js가 기준이다.
      function levelDef(index = game.index) {
        return LAYOUT.levels[index];
      }

      function chapterOf(index = game.index) {
        return LAYOUT.chapters.find((chapter) => chapter.id === levelDef(index).chapter);
      }

      function chapterNumber(index = game.index) {
        return LAYOUT.chapters.indexOf(chapterOf(index)) + 1;
      }

      function levelNumber(index = game.index) {
        return LAYOUT.levels.filter((level, i) => i <= index && level.chapter === levelDef(index).chapter).length;
      }

      function tileLeft(x) {
        return ORIGIN_X + x * TILE;
      }

      function tileTop(y) {
        return ORIGIN_Y + y * TILE_H;
      }

      // 고른 테마와 판의 배경 그림에 잰 격자(assets/bg-grid.js)가 있으면 그 격자를 쓰고, 없으면 layout.js의 기본 격자를 쓴다.
      function applyGrid() {
        const art = LAYOUT.art;
        const key = `bg-${levelDef().bg}`;
        const measured = assetPath(key) && ((window.VILLAIN_BG_GRID || {})[settings.theme] || {})[key];
        const grid = measured || {
          left: art.originX, top: art.originY, right: art.originX + art.columns * art.tile, bottom: art.originY + art.rows * art.tile,
        };
        ORIGIN_X = grid.left * SCALE;
        ORIGIN_Y = grid.top * SCALE;
        TILE = ((grid.right - grid.left) / art.columns) * SCALE;
        TILE_H = ((grid.bottom - grid.top) / art.rows) * SCALE;
      }

      // 배경. 그림이 있으면 한 장으로, 없으면 지도대로 상자를 놓는다.
      function drawBackdrop() {
        const colors = THEMES[settings.theme];
        const path = assetPath(`bg-${levelDef().bg}`);
        if (path) {
          const current = ui.backdrop.querySelector('img');
          if (!current || current.getAttribute('src') !== path) {
            ui.backdrop.innerHTML = `<img src="${path}" alt="" draggable="false">`;
          }
          return;
        }
        const boxes = [];
        const box = (x, y, w, h, color, extra = '') => boxes.push(
          `<div class="box" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${color};${extra}"></div>`);
        box(0, 0, 960, 540, colors.side);
        box(0, 0, 960, ORIGIN_Y, colors.wall);
        box(0, LAYOUT.art.uiTop * SCALE, 960, 540 - LAYOUT.art.uiTop * SCALE, '#151515');
        game.level.map.forEach((line, y) => {
          [...line].forEach((char, x) => {
            box(tileLeft(x), tileTop(y), TILE, TILE_H, colors.floor, `box-shadow: inset 0 0 0 1px ${colors.grid}`);
            if (char === 'T') box(tileLeft(x) + 2, tileTop(y) + 2, TILE - 4, TILE - 4, colors.table, 'border:2px solid #111;border-radius:6px');
            if (char === 'L') box(tileLeft(x) + 8, tileTop(y) + 4, TILE - 16, TILE - 10, colors.plant, 'border:2px solid #111;border-radius:50% 50% 10px 10px');
          });
        });
        ui.backdrop.innerHTML = boxes.join('');
      }

      // 움직이는 것과 바뀌는 것. 아래 줄에 있는 것이 앞에 보이도록 줄 번호로 겹침 순서를 정한다.
      function addSprite(key, width, height, color, options = {}) {
        const element = document.createElement('div');
        element.className = `sprite${options.sticker ? ' sticker' : ''}`;
        element.style.width = `${width}px`;
        element.style.height = `${height}px`;
        element.innerHTML = art(key, color, options.round);
        ui.actors.appendChild(element);
        return element;
      }

      // 칸 (x, y)의 아래쪽 가운데에 그림 아래쪽 가운데를 맞춘다.
      function placeOnTile(element, x, y, width, height) {
        const left = tileLeft(x) + (TILE - width) / 2;
        const top = tileTop(y) + TILE_H - height;
        element.style.transform = `translate(${left}px, ${top}px)`;
        element.style.zIndex = String(10 + y * 10);
      }

      // 손님 그림 key. 같은 사람이 줄지어 앉으면 복제 인간처럼 보여서, 그려 둔 손님 종류(customer, customer2, customer3...)를
      // 칸마다 번갈아 쓴다. (x + 2y)로 고르면 종류가 세 개 이상일 때 상하좌우로 붙은 손님끼리 겹치지 않는다.
      function customerKey(facing, x, y) {
        return variantKey('customer', `-${facing}`, x, y);
      }

      // 같은 종류의 그림 여러 장(name, name2, name3...) 가운데 칸마다 하나를 고른다. 그림이 하나도 없으면 첫 이름을 돌려준다.
      function variantKey(name, suffix, x, y) {
        const variants = ['', '2', '3', '4'].filter((variant) => assetPath(`${name}${variant}${suffix}`));
        if (variants.length === 0) return `${name}${suffix}`;
        return `${name}${variants[(x + 2 * y) % variants.length]}${suffix}`;
      }

      // 주인공 그림 크기. 앉은 손님과 키가 비슷해 묻혀서 1.2배로 그린다(2026-10-29 사용자 피드백).
      function playerWidth() {
        return TILE * 1.2;
      }

      function playerHeight() {
        return TILE * 1.8;
      }

      // 손님이 보는 방향. 이웃한 카페 테이블(o)을 먼저, 없으면 배경 테이블(T)을 본다. 둘 다 없으면 아래를 본다.
      function customerFacing(map, x, y) {
        const around = [['up', 0, -1], ['down', 0, 1], ['left', -1, 0], ['right', 1, 0]];
        for (const table of ['o', 'T']) {
          const found = around.find(([, dx, dy]) => (map[y + dy] || '')[x + dx] === table);
          if (found) return found[0];
        }
        return 'down';
      }

      // 물건 그림의 크기. 의자는 등받이가 위로 솟고, 진동벨은 의자와 같은 색이라 눈에 띄게 조금 크게 그린다.
      function itemSize(kind) {
        if (kind === 'chair') return [TILE, TILE * 1.25];
        if (kind === 'buzzer') return [TILE * 1.2, TILE * 1.2];
        return [TILE, TILE];
      }

      // 이미 그림이 있으면 src만 바꾼다. <img>를 새로 만들면 디코딩되는 동안 한 프레임 비어 보여 걸을 때 깜빡였다.
      function setArt(element, key, color, round) {
        const path = assetPath(key);
        const current = element.querySelector('img.art');
        if (path && current) {
          if (current.getAttribute('src') !== path) current.setAttribute('src', path);
          return;
        }
        element.innerHTML = art(key, color, round);
      }

      // 고른 테마의 그림을 미리 받아 디코딩해 둔다. 한꺼번에 70장 남짓을 요청하면 1MB가 넘는 배경과 일러스트 사이에
      // 40KB짜리 주인공 방향 그림이 묻혀 늦게 와서, 처음 방향을 바꿀 때 그림이 늦게 바뀌었다(2026-10-30 사용자 피드백).
      // 그래서 주인공과 물건 그림을 먼저 받고, 다음에 지금 레벨의 배경, 마지막에 나머지를 받는다. 받은 그림은 Map에 붙잡아 둔다.
      const preloaded = new Map();
      const FIRST_KEYS = ['player-up', 'player-down', 'player-left', 'player-right', 'buzzer', 'chair', 'trash', 'dock',
        'plug-mine', 'outlet-theirs', 'outlet-mine'];

      function loadImage(path) {
        if (preloaded.has(path)) return preloaded.get(path).ready;
        const image = new Image();
        image.src = path;
        const ready = (image.decode ? image.decode() : Promise.resolve()).catch(() => {});
        preloaded.set(path, { image, ready });
        return ready;
      }

      async function preloadTheme() {
        const themeAssets = (window.VILLAIN_ASSETS || {})[settings.theme] || {};
        const pathsOf = (keys) => keys.map((key) => themeAssets[key]).filter(Boolean);
        await Promise.all(pathsOf(FIRST_KEYS).map(loadImage));
        await Promise.all(pathsOf([`bg-${levelDef().bg}`]).map(loadImage));
        Object.values(themeAssets).forEach(loadImage);
      }

      function startLevel(index = game.index) {
        const fresh = index !== game.lastStarted;
        game.lastStarted = index;
        game.index = index;
        game.level = Engine.parseLevel(LAYOUT.levels[index]);
        game.state = game.level.start;
        game.history = [];
        game.won = false;
        game.busy = false;
        game.steps = 0;
        draw();
        opening(index, fresh);
      }

      // 레벨 시작 순서: 처음 켰으면 프롤로그, 챕터의 첫 레벨에 새로 들어왔으면 빌런 소개, 그다음 목표 짚기와 시연.
      async function opening(index, fresh) {
        game.busy = true;
        if (!settings.prologueSeen) await playPrologue();
        if (fresh && levelNumber(index) === 1) await showChapterCard(index);
        if (game.index !== index) return;
        await intro();
      }

      // 카드(프롤로그, 챕터 소개, 엔딩)를 띄우고, 아무 키나 누르거나 카드를 누르면 닫는다.
      // 앞 장면에서 누르던 키로 바로 넘어가지 않게 0.4초는 입력을 받지 않는다.
      function showCard({ kicker = '', title = '', lines = [], art = '', comic = false }) {
        ui.card.classList.toggle('comic', comic);
        ui.cardKicker.textContent = kicker;
        ui.cardTitle.textContent = title;
        ui.cardLines.innerHTML = lines.map((line) => `<p>${line}</p>`).join('');
        ui.cardArt.innerHTML = art;
        ui.card.hidden = false;
        const openedAt = Date.now();
        return new Promise((resolve) => {
          game.closeCard = () => {
            if (Date.now() - openedAt < 400) return;
            ui.card.hidden = true;
            game.closeCard = null;
            resolve();
          };
        });
      }

      function overlayOpen() {
        return !ui.card.hidden || !ui.settings.hidden;
      }

      function imageTag(key, extraClass = '') {
        const path = assetPath(key);
        return path ? `<img class="${extraClass}" src="${path}" alt="" draggable="false">` : '';
      }

      // 프롤로그. 글 없는 만화 다섯 컷(story-1 ~ story-5, 2026-10-30 사용자 요청)이고, 처음 한 번만 보이며 설정창에서 다시 볼 수 있다.
      // 컷은 WebP 한 장에 100KB 안팎이라 테마 그림과 함께 미리 받아 둔다(preloadTheme). 그림이 없으면 컷 대신 짧은 글 카드를 보여 준다.
      async function playPrologue() {
        const fallback = [
          '카페에서 일하는 청소 로봇의 배터리가 다 떨어져 간다.',
          '로봇의 충전 독 플러그를 손님이 뽑고 자기 멀티탭을 꽂았다.',
          '로봇이 손님에게 비켜 달라고 할 수는 없다. 약점을 건드려 스스로 떠나게 만든다.',
        ];
        if (!assetPath('story-1')) {
          for (const line of fallback) await showCard({ kicker: '프롤로그', lines: [line] });
        } else {
          for (let panel = 1; panel <= 5; panel += 1) {
            if (!assetPath(`story-${panel}`)) continue;
            await showCard({ art: imageTag(`story-${panel}`, 'comic'), comic: true });
          }
        }
        settings.prologueSeen = true;
        saveSettings();
      }

      function showChapterCard(index) {
        const chapter = chapterOf(index);
        return showCard({
          kicker: `${chapterNumber(index)}장`, title: chapter.name, lines: chapter.lines, art: imageTag(chapter.villain.idle),
        });
      }

      async function showEnding() {
        game.busy = true;
        await showCard({
          kicker: '도감 완성', title: '모든 콘센트를 되찾았다',
          lines: [`빌런 ${LAYOUT.chapters.length}명이 모두 스스로 플러그를 뽑고 떠났다.`],
          art: LAYOUT.chapters.map((chapter) => imageTag(chapter.villain.portrait, 'small')).join(''),
        });
        game.busy = false;
        startLevel(0);
      }

      // 아무 키나 누르면 시작 연출과 시연을 건너뛴다. 기다리는 동안 건너뛰기를 0.05초마다 확인한다.
      async function pause(ms) {
        const end = Date.now() + ms;
        while (Date.now() < end && !game.skip) await wait(50);
      }

      // 판 시작: 목표(빌런 자리의 콘센트와 뽑힌 내 충전기)를 짚고, 처음 나오는 기믹이면 한 번 시연한 뒤, 첫 판이면 조작키를 띄운다.
      async function intro() {
        const index = game.index;
        game.busy = true;
        game.skip = false;
        const colors = THEMES[settings.theme];
        // 빌런이 차지한 콘센트와 그 선, 그리고 바닥에 뽑혀 있는 충전 독의 플러그를 함께 짚는다.
        game.sprites.outlet.classList.add('pulse');
        game.sprites.cord.classList.add('pulse');
        if (game.sprites.dockPlug) game.sprites.dockPlug.classList.add('pulse');
        await pause(1400);
        game.sprites.outlet.classList.remove('pulse');
        game.sprites.cord.classList.remove('pulse');
        if (game.sprites.dockPlug) game.sprites.dockPlug.classList.remove('pulse');
        const demo = LAYOUT.levels[index].demo;
        if (demo && !settings.demosSeen.includes(demo.kind) && game.index === index) {
          game.skip = false;
          await runDemo(demo);
          settings.demosSeen.push(demo.kind);
          saveSettings();
        }
        if (game.index !== index) return;
        game.busy = false;
        game.skip = false;
        if (index === 0 && !settings.keysSeen && window.matchMedia('(hover: hover)').matches) showKeys();
      }

      // 반투명한 주인공의 시연. push는 물건을 한 칸 밀어 보이고, view는 화각에 들어갔다가 붉게 깜빡이며 되돌아온다.
      async function runDemo(demo) {
        const colors = THEMES[settings.theme];
        const d = Engine.DIRECTIONS[demo.dir];
        const ghost = addSprite(`player-${demo.dir}`, playerWidth(), playerHeight(), colors.player, { round: true });
        ghost.classList.add('ghost');
        placeOnTile(ghost, demo.from.x, demo.from.y, playerWidth(), playerHeight());
        await pause(500);
        if (demo.kind === 'push') {
          const target = { x: demo.from.x + d.dx, y: demo.from.y + d.dy };
          const index = game.state.items.findIndex((item) => item.x === target.x && item.y === target.y);
          const real = game.sprites.items[index];
          const kind = game.state.items[index].kind;
          const [width, height] = itemSize(kind);
          const ghostItem = addSprite(kind, width, height, colors.item);
          ghostItem.classList.add('ghost', `kind-${kind}`);
          placeOnTile(ghostItem, target.x, target.y, width, height);
          real.style.opacity = '0';
          await pause(300);
          placeOnTile(ghost, target.x, target.y, playerWidth(), playerHeight());
          placeOnTile(ghostItem, target.x + d.dx, target.y + d.dy, width, height);
          await pause(900);
          ghostItem.style.opacity = '0';
          ghost.style.opacity = '0';
          await wait(300);
          ghostItem.remove();
          real.style.opacity = '';
        } else {
          const into = { x: demo.from.x + d.dx, y: demo.from.y + d.dy };
          placeOnTile(ghost, into.x, into.y, playerWidth(), playerHeight());
          ghost.style.zIndex = '220';
          await pause(350);
          ui.scene.classList.add('seen');
          await pause(450);
          ui.scene.classList.remove('seen');
          placeOnTile(ghost, demo.from.x, demo.from.y, playerWidth(), playerHeight());
          ghost.style.zIndex = '220';
          await pause(600);
          ghost.style.opacity = '0';
          await wait(300);
        }
        ghost.remove();
      }

      function showKeys() {
        const hint = document.createElement('div');
        hint.className = 'keys-hint';
        hint.id = 'keys-hint';
        hint.innerHTML = '<span class="keycap up">↑</span><span class="keycap left">←</span><span class="keycap down">↓</span>'
          + '<span class="keycap right">→</span><span class="keycap undo">Z ↶</span><span class="keycap restart">R</span>';
        const p = game.state.player;
        hint.style.left = `${tileLeft(p.x) + TILE + 8}px`;
        hint.style.top = `${tileTop(p.y) - TILE * 1.6}px`;
        ui.actors.appendChild(hint);
      }

      function hideKeys() {
        const hint = document.getElementById('keys-hint');
        if (!hint) return;
        settings.keysSeen = true;
        saveSettings();
        hint.classList.add('fade');
        setTimeout(() => hint.remove(), 400);
      }

      function draw() {
        const colors = THEMES[settings.theme];
        const { level, state } = game;
        applyGrid();
        drawBackdrop();
        ui.actors.innerHTML = '';
        // 새로 만든 그림이 처음 자리로 갈 때는 움직임 효과를 끈다. 켜 두면 모든 그림이 장면 왼쪽 위에서 미끄러져 들어와 깜빡였다.
        ui.actors.classList.add('instant');
        game.sprites.filmer = null;
        ui.portrait.classList.remove('show');
        const villain = level.villain;
        const look = chapterOf().villain;
        ui.portrait.innerHTML = art(look.portrait, colors.villain, true);

        // 콘센트는 판 밖 -1번 줄의 벽에 붙는다. 열은 빌런과 같거나, 판에 따로 정한 열(outletX)이다.
        game.sprites.outlet = addSprite('outlet-theirs', TILE, TILE, colors.outletTheirs, { round: true });
        placeOnTile(game.sprites.outlet, look.outletX !== undefined ? look.outletX : villain.x, -1, TILE, TILE);

        // 로봇 충전 독. 콘센트 오른쪽(판 끝이면 왼쪽) 벽 아래에 놓인다. 손님이 독의 플러그를 뽑아서, 플러그가 바닥에 나와 있다.
        const outletCol = look.outletX !== undefined ? look.outletX : villain.x;
        game.dockCols = { outlet: outletCol, dock: outletCol + 1 < LAYOUT.art.columns ? outletCol + 1 : outletCol - 1 };
        game.sprites.dock = addSprite('dock', TILE, TILE, '#9a9a9a', { round: true });
        placeOnTile(game.sprites.dock, game.dockCols.dock, -1, TILE, TILE);
        game.sprites.dock.style.zIndex = '1';
        drawDockCord(false);

        // 빌런 그림의 크기와 아래쪽이 닿는 칸은 판마다 다르다(잠든 빌런은 테이블 칸까지 엎드려 있다). layout.js가 기준이다.
        game.sprites.villain = addSprite(look.idle, TILE, TILE * look.heightTiles, colors.villain, { round: true });
        placeOnTile(game.sprites.villain, villain.x, villain.y + look.anchorRow, TILE, TILE * look.heightTiles);
        game.sprites.cord = drawCord(look, villain, colors);
        ui.battery.classList.remove('full');

        // 카페 테이블(o)과 앉은 손님(N). 움직이지 않는 칸이고, 상호작용하지 않으므로 스티커 테두리가 없다.
        // 손님은 이웃한 테이블 쪽을 본다(그림 key: customer-up/down/left/right). 그림이 오기 전에는 상자로 보인다.
        level.map.forEach((line, y) => [...line].forEach((char, x) => {
          if (char === 'o') {
            const table = addSprite(variantKey('cafe-table', '', x, y), TILE, TILE * 1.1, colors.table);
            table.classList.add('kind-table');
            placeOnTile(table, x, y, TILE, TILE * 1.1);
          } else if (char === 'q') {
            const prop = addSprite(variantKey('decor', '', x, y), TILE, TILE * 1.25, colors.table);
            prop.classList.add('kind-decor');
            placeOnTile(prop, x, y, TILE, TILE * 1.25);
          } else if (char === 'F') {
            // 셋째 챕터의 촬영자. 테이블 위 폰을 보고 앉은 뒷모습이고, 화각은 촬영자 뒤(아래)로 뻗는다.
            const filmerLook = chapterOf().filmer;
            game.sprites.filmer = addSprite(filmerLook.idle, TILE, TILE * filmerLook.heightTiles, colors.villain, { round: true });
            placeOnTile(game.sprites.filmer, x, y, TILE, TILE * filmerLook.heightTiles);
          } else if (char === 'N') {
            const facing = customerFacing(level.map, x, y);
            const customer = addSprite(customerKey(facing, x, y), TILE, TILE * 1.5, colors.customer);
            customer.classList.add('kind-customer');
            customer.dataset.facing = facing;
            placeOnTile(customer, x, y, TILE, TILE * 1.5);
          }
        }));
        game.sprites.items = state.items.map((item) => {
          const size = itemSize(item.kind);
          const element = addSprite(item.kind, size[0], size[1], colors.item, { sticker: true, round: item.kind === 'buzzer' });
          element.dataset.kind = item.kind;
          element.classList.add('kind-' + item.kind);
          return element;
        });
        game.sprites.player = addSprite(`player-${state.facing}`, playerWidth(), playerHeight(), colors.player, { sticker: true, round: true });
        game.sprites.player.classList.add('is-player');
        game.sprites.player.style.setProperty('--player-color', colors.player);
        drawGoal();
        drawStream();
        syncFilmer();
        requestAnimationFrame(() => requestAnimationFrame(() => ui.actors.classList.remove('instant')));
        placeAll();
        drawView();
        drawDots();
        ui.undo.disabled = game.history.length === 0;
        ui.nextCue.hidden = true;
      }

      // 충전 독의 선. 뽑힌 상태(plugged false)에서는 독에서 나온 선 끝의 플러그가 콘센트 아래 바닥에 놓여 있고,
      // 꽂힌 상태에서는 선이 콘센트까지 이어진다. 선 안쪽 색은 주인공 색이다.
      function drawDockCord(plugged) {
        const colors = THEMES[settings.theme];
        if (game.sprites.dockCord) game.sprites.dockCord.remove();
        if (game.sprites.dockPlug) game.sprites.dockPlug.remove();
        game.sprites.dockPlug = null;
        const { outlet, dock } = game.dockCols;
        const x1 = tileLeft(dock) + TILE / 2 + (outlet > dock ? TILE * 0.3 : -TILE * 0.3);
        const y1 = tileTop(-1) + TILE_H * 0.8;
        const x2 = plugged ? tileLeft(outlet) + TILE / 2 : (tileLeft(dock) + tileLeft(outlet)) / 2 + TILE / 2;
        const y2 = plugged ? tileTop(-1) + TILE_H * 0.62 : tileTop(-1) + TILE_H * 0.95;
        const path = `M ${x1} ${y1} Q ${(x1 + x2) / 2} ${Math.max(y1, y2) + TILE_H * 0.25} ${x2} ${y2}`;
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'cord');
        svg.innerHTML = `<path d="${path}" stroke="#111" stroke-width="5"></path>`
          + `<path d="${path}" stroke="${colors.outletMine}" stroke-width="2.5"></path>`;
        svg.style.zIndex = '2';
        ui.actors.appendChild(svg);
        game.sprites.dockCord = svg;
        if (plugged) return;
        const size = TILE * 0.42;
        const plug = document.createElement('div');
        plug.className = 'sprite dock-plug';
        plug.style.width = `${size}px`;
        plug.style.height = `${size}px`;
        plug.style.transform = `translate(${x2 - size / 2}px, ${y2 - size / 2}px)`;
        plug.style.zIndex = '3';
        plug.innerHTML = art('plug-mine', colors.outletMine, true);
        ui.actors.appendChild(plug);
        game.sprites.dockPlug = plug;
      }

      // 벽 콘센트에서 빌런까지 늘어진 충전 선. 콘센트를 누가 차지했는지 보여 준다. 빌런 그림 뒤로 들어가게 겹침 순서를 하나 낮춘다.
      function drawCord(look, villain, colors) {
        const outletX = look.outletX !== undefined ? look.outletX : villain.x;
        const x1 = tileLeft(outletX) + TILE / 2;
        const y1 = tileTop(-1) + TILE_H * 0.7;
        const side = outletX > villain.x ? 0.3 : (outletX < villain.x ? -0.3 : 0.2);
        const x2 = tileLeft(villain.x) + TILE / 2 + TILE * side;
        const y2 = tileTop(villain.y + look.anchorRow) + TILE_H * 0.4;
        const bend = outletX === villain.x ? TILE * 0.7 : 0;
        const cx = (x1 + x2) / 2 + bend;
        const cy = Math.max(y1, y2) + TILE_H * 0.3;
        const path = `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'cord');
        svg.innerHTML = `<path d="${path}" stroke="#111" stroke-width="6"></path>`
          + `<path class="cord-glow" d="${path}" stroke="${colors.outletTheirs}" stroke-width="3"></path>`;
        svg.style.zIndex = String(9 + (villain.y + look.anchorRow) * 10);
        ui.actors.appendChild(svg);
        return svg;
      }

      // 1번 판처럼 진동벨을 놓을 칸이 있는 판은 그 칸에 점선 윤곽을 그린다.
      function drawGoal() {
        ui.scene.querySelectorAll('.goal-mark').forEach((element) => element.remove());
        game.sprites.goal = null;
        if (!game.level.goal) return;
        const element = document.createElement('div');
        element.className = 'goal-mark';
        element.style.left = `${tileLeft(game.level.goal.x)}px`;
        element.style.top = `${tileTop(game.level.goal.y)}px`;
        element.style.width = `${TILE}px`;
        element.style.height = `${TILE_H}px`;
        ui.view.parentNode.insertBefore(element, ui.actors);
        game.sprites.goal = element;
      }

      function updateGoal(state = game.state) {
        if (!game.sprites.goal) return;
        const goal = game.level.goal;
        const near = state.items.some((item) => item.kind === 'buzzer' && Math.abs(item.x - goal.x) + Math.abs(item.y - goal.y) === 1);
        game.sprites.goal.classList.toggle('near', near);
      }

      // 화각이 있는 판은 화면 귀퉁이에 방송 화면 창을 띄운다.
      function drawStream() {
        const old = document.getElementById('stream');
        if (old) old.remove();
        game.sprites.stream = null;
        if (!game.level.view) return;
        const colors = THEMES[settings.theme];
        const look = chapterOf().villain;
        const element = document.createElement('div');
        element.className = 'stream';
        element.id = 'stream';
        element.innerHTML = `<div class="frame-art">${assetPath('stream-frame') ? art('stream-frame', '#2b2b2b') : ''}</div>`
          + '<div class="slots"></div>'
          + `<div class="face">${art(chapterOf().filmer ? chapterOf().filmer.face : `${look.idle.split('-')[0]}-face`, colors.villain, true)}</div>`
          + '<div class="live"></div>';
        ui.scene.appendChild(element);
        game.sprites.stream = element;
      }

      // 셋째 챕터: 촬영자가 떠났으면 촬영자와 촬영 화면 창을 숨기고, 되돌리기로 돌아왔으면 다시 보인다.
      function syncFilmer(state = game.state) {
        if (!game.sprites.filmer) return;
        const look = chapterOf().filmer;
        game.sprites.filmer.classList.toggle('gone', Boolean(state.gone));
        if (!state.gone) setArt(game.sprites.filmer, look.idle, THEMES[settings.theme].villain, true);
        if (game.sprites.stream) game.sprites.stream.hidden = Boolean(state.gone);
      }

      // 쓰레기통이 촬영 화면에 잡힌 순간: 화면 창이 요동치고, 촬영자가 놀라 돌아본 뒤 촬영을 접고 떠난다. 판은 계속된다.
      async function filmerLeaves() {
        game.busy = true;
        const look = chapterOf().filmer;
        if (game.sprites.stream) game.sprites.stream.classList.add('chaos');
        ui.scene.classList.add('seen');
        Sound.play('shutter');
        await wait(250);
        ui.scene.classList.remove('seen');
        setArt(game.sprites.filmer, look.react, THEMES[settings.theme].villain, true);
        await wait(900);
        if (game.sprites.stream) game.sprites.stream.classList.remove('chaos');
        syncFilmer();
        game.busy = false;
      }

      // 방송 화면 창의 세 칸에 카메라가 줄마다 처음 비추는 것을 그린다.
      function updateStream(state = game.state) {
        if (!game.sprites.stream) return;
        const colors = THEMES[settings.theme];
        const hits = Engine.viewOf(game.level, state).hits;
        const slots = game.sprites.stream.querySelector('.slots');
        slots.innerHTML = hits.map((hit) => {
          if (!hit) return '<div class="slot"></div>';
          const color = hit === 'player' ? colors.player : colors.item;
          const key = hit === 'player' ? 'player-up' : hit;
          return `<div class="slot kind-${hit}">${art(key, color, hit === 'player')}</div>`;
        }).join('');
      }

      // 카메라 화각을 칸마다 노랗게 칠한다. 의자 같은 물건에 막히면 그 뒤는 칠하지 않는다.
      function drawView(state = game.state) {
        ui.view.innerHTML = '';
        updateGoal(state);
        updateStream(state);
        if (game.won) return;
        for (const cell of Engine.viewOf(game.level, state).cells) {
          const element = document.createElement('div');
          element.className = 'view-cell';
          element.style.left = `${tileLeft(cell.x)}px`;
          element.style.top = `${tileTop(cell.y)}px`;
          element.style.width = `${TILE}px`;
          element.style.height = `${TILE_H}px`;
          ui.view.appendChild(element);
        }
      }

      // 위쪽 막대의 레벨 점. 챕터마다 번호 하나와 레벨 점들을 묶어 보여 준다.
      function drawDots() {
        ui.dots.innerHTML = '';
        LAYOUT.chapters.forEach((chapter, chapterIndex) => {
          const group = document.createElement('div');
          group.className = 'dot-group';
          group.innerHTML = `<span class="dot-chapter">${chapterIndex + 1}</span>`;
          LAYOUT.levels.forEach((level, index) => {
            if (level.chapter !== chapter.id) return;
            const dot = document.createElement('button');
            dot.type = 'button';
            dot.className = 'dot';
            dot.setAttribute('aria-label', `${chapterIndex + 1}-${levelNumber(index)}`);
            dot.classList.toggle('current', index === game.index);
            dot.classList.toggle('cleared', game.cleared.has(level.id));
            dot.addEventListener('click', () => {
              if (!game.busy && !overlayOpen()) startLevel(index);
            });
            group.appendChild(dot);
          });
          ui.dots.appendChild(group);
        });
      }

      function placeAll(state = game.state) {
        state.items.forEach((item, index) => {
          const element = game.sprites.items[index];
          const [width, height] = itemSize(element.dataset.kind);
          placeOnTile(element, item.x, item.y, width, height);
        });
        placeOnTile(game.sprites.player, state.player.x, state.player.y, playerWidth(), playerHeight());
        game.sprites.player.style.zIndex = String(15 + state.player.y * 10);
      }

      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function move(direction) {
        Sound.start();
        if (game.busy || game.won) return;
        const result = Engine.step(game.level, game.state, direction);
        const colors = THEMES[settings.theme];
        if (result.state.facing !== game.state.facing) {
          setArt(game.sprites.player, `player-${result.state.facing}`, colors.player, true);
        }
        if (result.seen) {
          Sound.play('shutter');
          // 화각에 들어가는 걸음: 내디딘 모습을 잠깐 보여 주고 화각이 붉어진 뒤 제자리로 돌아온다. 기록은 남기지 않는다.
          game.busy = true;
          placeAll(result.attempted);
          drawView(result.attempted);
          ui.scene.classList.add('seen');
          await wait(380);
          ui.scene.classList.remove('seen');
          game.state = result.state;
          placeAll();
          drawView();
          game.busy = false;
          return;
        }
        if (!result.moved) {
          Sound.play('bump');
          game.state = result.state;
          ui.scene.classList.remove('bump');
          void ui.scene.offsetWidth;
          ui.scene.classList.add('bump');
          return;
        }
        if (result.pushed !== null) {
          const pushSound = PUSH_SOUNDS[result.state.items[result.pushed].kind] || PUSH_SOUNDS.chair;
          Sound.play('chair', pushSound);
        }
        game.history.push(game.state);
        game.state = result.state;
        game.steps += 1;
        if (game.steps >= 3) hideKeys();
        game.sprites.player.classList.remove('hop');
        void game.sprites.player.offsetWidth;
        game.sprites.player.classList.add('hop');
        placeAll();
        drawView();
        ui.undo.disabled = false;
        if (result.filmerLeft) await filmerLeaves();
        if (result.won) await win();
      }

      // 빌런의 약점이 건드려지면(진동벨이 울리거나 쓰레기통이 방송에 비치면) 빌런이 반응하고, 반응 일러스트가 뜬 뒤,
      // 빌런이 충전기를 챙겨 떠나고 내 충전기가 꽂힌다.
      async function win() {
        game.won = true;
        game.busy = true;
        const colors = THEMES[settings.theme];
        const look = chapterOf().villain;
        const triggerKind = game.level.goal ? 'buzzer' : 'trash';
        const trigger = game.sprites.items[game.state.items.findIndex((item) => item.kind === triggerKind)];
        await wait(180);
        if (!game.level.goal) {
          // 방송 화면에 쓰레기통이 비친 순간: 방송 화면 창이 요동치고 화각이 한 번 깜빡인다.
          if (game.sprites.stream) game.sprites.stream.classList.add('chaos');
          ui.scene.classList.add('seen');
          await wait(250);
          ui.scene.classList.remove('seen');
        }
        trigger.classList.add('ringing');
        Sound.play(game.level.goal ? 'buzzer' : 'shutter');
        await wait(800);
        drawView();
        setArt(game.sprites.villain, look.react, colors.villain, true);
        ui.flash.classList.remove('go');
        void ui.flash.offsetWidth;
        ui.flash.classList.add('go');
        Sound.chime();
        ui.portrait.classList.toggle('left', game.level.villain.x >= LAYOUT.art.columns / 2);
        ui.scene.classList.add('cut-in');
        ui.portrait.classList.add('show');
        await wait(1800);
        ui.portrait.classList.remove('show');
        ui.scene.classList.remove('cut-in');
        game.sprites.villain.classList.add('gone');
        game.sprites.cord.classList.add('gone');
        await wait(500);
        setArt(game.sprites.outlet, 'outlet-mine', colors.outletMine, true);
        drawDockCord(true);
        Sound.play('plug');
        ui.battery.classList.add('full');
        game.cleared.add(game.level.id);
        drawDots();
        ui.nextCue.hidden = false;
        game.busy = false;
      }

      // 레벨을 깬 뒤에는 아무 키나 누르거나 화면을 누르면 다음 레벨로 간다. 마지막 레벨 다음은 엔딩 카드다.
      function goNext() {
        if (game.busy || !game.won) return;
        if (game.index === LAYOUT.levels.length - 1) showEnding();
        else startLevel(game.index + 1);
      }

      function undo() {
        if (game.busy || game.history.length === 0) return;
        const wasWon = game.won;
        game.state = game.history.pop();
        game.won = false;
        if (wasWon) {
          draw();
          return;
        }
        setArt(game.sprites.player, `player-${game.state.facing}`, THEMES[settings.theme].player, true);
        placeAll();
        drawView();
        syncFilmer();
        ui.undo.disabled = game.history.length === 0;
      }

      // 소리. 배경 음악은 MP3 앞뒤의 짧은 무음을 잘라 내고 그 구간만 끊김 없이 반복한다(MP3를 그냥 반복하면 이음매에서 끊긴다).
      // 브라우저는 사람이 한 번 누르기 전에는 소리를 내지 못하게 하므로, 첫 입력 때 시작한다.
      const Sound = (function () {
        let context = null;
        let master = null;
        let bgmGain = null;
        let sfxGain = null;
        let starting = false;
        const buffers = {};
        // 설정 100%일 때의 크기. 배경 음악은 원래의 30%(약 -10dB)다. 기본값(음악 60)에서 가장 큰 0.1초 구간이 약 -24dB다.
        const MUSIC_MAX = 0.3;
        // 효과음은 아래 SFX 표에서 파일마다 크기를 맞춘 뒤 이 값을 곱한다. 기본값(효과음 50)에서 약 -26dB로 음악보다 조금 낮다.
        const SFX_MAX = 1;
        // 효과음 파일(ElevenLabs, 2026-10-29 사용자 제작)과 파일마다 곱할 크기.
        // 가장 큰 0.1초 구간의 크기를 -20dB에 맞췄고, 피크가 -0.5dB를 넘지 않게 묶었다. 잰 값은 주석에 적는다(known-issues 19번).
        const SFX = {
          bump: { file: 'assets/sfx/bump.mp3', gain: 3.5 }, // 원래 -30.9dB, 피크 -18.5dB
          buzzer: { file: 'assets/sfx/buzzer.mp3', gain: 0.52 }, // 원래 -16.3dB. 1초 동안 울려서 다른 것보다 2dB 낮게 둔다
          chair: { file: 'assets/sfx/chair.mp3', gain: 16 }, // 원래 -44.3dB, 피크 -34.6dB
          plug: { file: 'assets/sfx/plug.mp3', gain: 1.09 }, // 원래 -22.5dB, 피크 -1.2dB라 피크에 맞춰 묶었다
          shutter: { file: 'assets/sfx/shutter.mp3', gain: 1 }, // 원래 -20.1dB
        };

        async function load(url) {
          const response = await fetch(url);
          return context.decodeAudioData(await response.arrayBuffer());
        }

        // 소리가 시작되고 끝나는 때(초). 효과음 앞의 무음(최대 0.18초)을 건너뛰어야 동작과 소리가 맞는다.
        function audibleRange(buffer) {
          const data = buffer.getChannelData(0);
          const threshold = 0.003;
          let first = 0;
          while (first < data.length && Math.abs(data[first]) < threshold) first += 1;
          let last = data.length - 1;
          while (last > first && Math.abs(data[last]) < threshold) last -= 1;
          return { start: first / buffer.sampleRate, end: (last + 1) / buffer.sampleRate };
        }

        async function start() {
          if (starting || !window.AudioContext) return;
          starting = true;
          try {
            context = new AudioContext();
            master = context.createGain();
            master.connect(context.destination);
            sfxGain = context.createGain();
            sfxGain.connect(master);
            bgmGain = context.createGain();
            bgmGain.connect(master);
            setVolumes();
            await Promise.all(Object.entries(SFX).map(async ([name, sound]) => {
              buffers[name] = await load(sound.file);
              sound.range = audibleRange(buffers[name]);
            }));
            const bgm = await load('assets/audio/bgm-cafe.mp3');
            const range = audibleRange(bgm);
            const source = context.createBufferSource();
            source.buffer = bgm;
            source.loop = true;
            source.loopStart = range.start;
            source.loopEnd = range.end;
            source.connect(bgmGain);
            source.start(0, range.start);
          } catch (error) {
            // 파일을 직접 연 경우처럼 소리를 불러올 수 없으면 소리 없이 진행한다.
          }
        }

        // 효과음 하나. rate는 재생 속도(높을수록 가볍고 높은 소리), volume은 표의 크기에 한 번 더 곱하는 값이다.
        function play(name, { rate = 1, volume = 1 } = {}) {
          const buffer = buffers[name];
          if (!context || !buffer) return;
          const source = context.createBufferSource();
          const gain = context.createGain();
          source.buffer = buffer;
          source.playbackRate.value = rate;
          gain.gain.value = SFX[name].gain * volume;
          source.connect(gain).connect(sfxGain);
          source.start(0, SFX[name].range.start);
        }

        // 클리어 화음. 배경 음악이 D단조라서(크로마 분석, 일치도 0.88) 나란한조 F장조의 Fmaj7을 아래에서 위로 펼친다.
        // 음색은 배경 음악의 Rhodes에 맞춰 FM 합성으로 만든 전자 피아노 소리다. 길이는 약 1.8초다.
        function chime() {
          if (!context) return;
          const now = context.currentTime + 0.02;
          const notes = [349.23, 440, 523.25, 659.26, 698.46];
          notes.forEach((frequency, index) => {
            const last = index === notes.length - 1;
            rhodes(frequency, now + index * 0.075, last ? 1.6 : 1.2, last ? 0.2 : 0.14);
          });
          // 화음이 나오는 동안 배경 음악을 35%로 줄였다가 되돌린다.
          const full = musicLevel();
          bgmGain.gain.cancelScheduledValues(now);
          bgmGain.gain.setTargetAtTime(full * 0.35, now, 0.05);
          bgmGain.gain.setTargetAtTime(full, now + 1.4, 0.4);
        }

        function rhodes(frequency, when, length, level) {
          const carrier = context.createOscillator();
          const modulator = context.createOscillator();
          const depth = context.createGain();
          const amp = context.createGain();
          carrier.frequency.value = frequency;
          modulator.frequency.value = frequency;
          depth.gain.setValueAtTime(frequency * 2.2, when);
          depth.gain.exponentialRampToValueAtTime(frequency * 0.2, when + 0.45);
          amp.gain.setValueAtTime(0.0001, when);
          amp.gain.exponentialRampToValueAtTime(level, when + 0.006);
          amp.gain.exponentialRampToValueAtTime(0.0001, when + length);
          modulator.connect(depth).connect(carrier.frequency);
          carrier.connect(amp).connect(sfxGain);
          modulator.start(when);
          carrier.start(when);
          modulator.stop(when + length);
          carrier.stop(when + length);
        }

        function musicLevel() {
          return MUSIC_MAX * (settings.music / 100);
        }

        function setVolumes() {
          if (bgmGain) bgmGain.gain.value = musicLevel();
          if (sfxGain) sfxGain.gain.value = SFX_MAX * (settings.sfx / 100);
        }

        return { start, play, chime, setVolumes };
      })();

      function applySettings() {
        ui.viewport.style.filter = settings.brightness === 100 ? '' : `brightness(${settings.brightness / 100})`;
        ui.themeButtons.forEach((button) => button.classList.toggle('on', button.dataset.theme === settings.theme));
        ui.setBrightness.value = settings.brightness;
        ui.setMusic.value = settings.music;
        ui.setSfx.value = settings.sfx;
        Sound.setVolumes();
      }

      // 오른쪽 옆벽의 조작법 안내. 글자를 하나씩 감싸고 시작 시점을 엇갈려, 글자마다 따로 꼬물거리게 한다.
      function buildSideKeys() {
        const lines = [['↑↓←→', '이동'], ['Z', '되돌리기'], ['R', '처음부터'], ['Esc', '설정']];
        let order = 0;
        const wobbly = (text) => [...text].map((char) => {
          order += 1;
          return `<span class="wob" style="animation-delay:-${(order * 0.17) % 0.75}s">${char}</span>`;
        }).join('');
        document.getElementById('side-keys').innerHTML = lines
          .map(([key, word]) => `<div><span class="key">${wobbly(key)}</span>${wobbly(word)}</div>`).join('');
      }

      // 설정창. 연출 중에는 그림체를 바꾸거나 프롤로그를 다시 볼 수 없다(연출이 그리던 그림이 섞인다).
      function openSettings() {
        ui.settings.hidden = false;
        ui.themeButtons.forEach((button) => { button.disabled = game.busy; });
        ui.replayPrologue.disabled = game.busy;
        ui.closeSettings.focus();
      }

      function closeSettings() {
        ui.settings.hidden = true;
        ui.openSettings.focus();
      }

      // 밀 때 나는 소리. 녹음은 의자 끄는 소리 하나라서, 가벼운 물건일수록 높고 작게 튼다.
      const PUSH_SOUNDS = {
        chair: { rate: 1, volume: 1 },
        trash: { rate: 1.2, volume: 0.8 },
        buzzer: { rate: 1.45, volume: 0.6 },
      };

      const MODIFIER_KEYS = ['shift', 'control', 'alt', 'meta', 'tab', 'capslock'];

      const KEY_DIRECTIONS = {
        arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down', arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right',
      };

      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        if (!ui.settings.hidden) {
          if (key === 'escape') closeSettings();
          return;
        }
        if (key === 'escape') {
          openSettings();
          return;
        }
        if (game.closeCard) {
          if (!MODIFIER_KEYS.includes(key)) {
            event.preventDefault();
            game.closeCard();
          }
          return;
        }
        if (game.busy && !game.won) {
          // 시작 연출이나 시연 중에는 아무 키나 누르면 건너뛴다.
          game.skip = true;
          if (KEY_DIRECTIONS[key]) event.preventDefault();
          return;
        }
        if (KEY_DIRECTIONS[key] && !game.won) {
          event.preventDefault();
          move(KEY_DIRECTIONS[key]);
        } else if (key === 'z' || key === 'backspace') {
          event.preventDefault();
          undo();
        } else if (key === 'r') {
          if (!game.busy) startLevel();
        } else if (game.won && !MODIFIER_KEYS.includes(key)) {
          event.preventDefault();
          goNext();
        }
      });
      document.querySelectorAll('#pad [data-dir]').forEach((button) => {
        button.addEventListener('click', () => {
          if (game.closeCard) {
            game.closeCard();
            return;
          }
          if (game.busy && !game.won) {
            game.skip = true;
            return;
          }
          if (game.won) goNext();
          else move(button.dataset.dir);
        });
      });
      ui.undo.addEventListener('click', undo);
      ui.viewport.addEventListener('click', goNext);
      ui.restart.addEventListener('click', () => {
        if (!game.busy) startLevel();
      });
      ui.card.addEventListener('click', () => {
        if (game.closeCard) game.closeCard();
      });
      ui.openSettings.addEventListener('click', openSettings);
      ui.closeSettings.addEventListener('click', closeSettings);
      ui.settings.addEventListener('click', (event) => {
        if (event.target === ui.settings) closeSettings();
      });
      ui.themeButtons.forEach((button) => button.addEventListener('click', () => {
        if (game.busy) return;
        settings.theme = button.dataset.theme;
        saveSettings();
        applySettings();
        preloadTheme();
        draw();
        if (game.won) {
          game.sprites.villain.classList.add('gone');
          game.sprites.cord.classList.add('gone');
          setArt(game.sprites.outlet, 'outlet-mine', THEMES[settings.theme].outletMine, true);
          drawDockCord(true);
          ui.battery.classList.add('full');
          ui.nextCue.hidden = false;
        }
      }));
      [['setBrightness', 'brightness'], ['setMusic', 'music'], ['setSfx', 'sfx']].forEach(([element, name]) => {
        ui[element].addEventListener('input', () => {
          settings[name] = Number(ui[element].value);
          saveSettings();
          applySettings();
          Sound.start();
        });
      });
      ui.replayPrologue.addEventListener('click', async () => {
        if (game.busy) return;
        closeSettings();
        game.busy = true;
        await playPrologue();
        game.busy = false;
      });
      new ResizeObserver(fitScene).observe(ui.stage);

      applySettings();
      preloadTheme();
      buildSideKeys();
      startLevel(0);
      fitScene();
    })();
  </script>
</body>
</html>
